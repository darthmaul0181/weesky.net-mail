name: Build and test
description: Build snoopy.microservice, run tests and publish coverage

inputs:
  working-directory:
    description: Path to the .NET project root
    required: true

runs:
  using: composite
  steps:
    - name: .net setup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dotnet restore

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dotnet build --no-restore

    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ${{ inputs.working-directory }}/coverage/**/coverage.cobertura.xml
        badge: true
        format: markdown
        output: both

    - name: PR comment
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs')
          const body = fs.readFileSync('code-coverage-results.md', 'utf8')
          const marker = '<!-- coverage-report -->'
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          })
          const existing = comments.data.find(c => c.body.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: marker + '\n' + body
            })
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: marker + '\n' + body
            })
          }
