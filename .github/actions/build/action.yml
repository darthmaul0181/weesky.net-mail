name: Build and test
description: Build snoopy.microservice, run tests and publish coverage

runs:
  using: composite
  steps:
    - name: .net setup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      shell: bash
      working-directory: mail/snoopy.microservice
      run: dotnet restore

    - name: Build
      shell: bash
      working-directory: mail/snoopy.microservice
      run: dotnet build --no-restore

    - name: Test
      shell: bash
      working-directory: mail/snoopy.microservice
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: mail/snoopy.microservice/coverage/**/coverage.cobertura.xml
        badge: true
        format: markdown
        output: both

    - name: PR comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
