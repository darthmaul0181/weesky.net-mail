name: Firewall rule
description: Enable or disable the OPNsense SSH rule on curiosity.weesky.net

inputs:
  enabled:
    description: '"1" to open, "0" to close'
    required: true
  credentials:
    description: OPNsense API credentials (user:key)
    required: true
  endpoint:
    description: OPNsense API base URL
    required: true
  rule_id:
    description: UUID of the firewall rule to toggle
    required: true

runs:
  using: composite
  steps:
    - name: Set rule
      shell: bash
      run: |
        result=$(curl -s -f -u "${{ inputs.credentials }}" \
          -X POST -H "Content-Type: application/json" \
          -d "{\"rule\": {\"enabled\": \"${{ inputs.enabled }}\"}}" \
          "${{ inputs.endpoint }}/api/firewall/filter/setRule/${{ inputs.rule_id }}")
        echo "$result"
        echo "$result" | jq -e '.result == "saved"' > /dev/null

    - name: Apply
      shell: bash
      run: |
        result=$(curl -s -f -u "${{ inputs.credentials }}" \
          -X POST \
          "${{ inputs.endpoint }}/api/firewall/filter/apply")
        echo "$result"
        echo "$result" | jq -e '.status | startswith("OK")' > /dev/null
