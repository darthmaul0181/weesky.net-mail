name: deploy

on:
  push:
    # Both lines, always: with `tags-ignore` alone GitHub stops running the workflow on BRANCH
    # pushes altogether — the ref type left undefined is the one excluded, and the whole pipeline
    # went silent for a branch push. The tag filter is there because the deploy pushes its release
    # tags itself and a tag ref carries no environment: it would build and deploy `dev` as v1.0.0.
    # v* predates the split into web-v* and api-v*; image-v* is the Docker image's (image.yml).
    branches: ['**']
    tags-ignore: ['v*', 'web-v*', 'api-v*', 'image-v*']
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Each half is numbered by the VERSION file inside its own folder.
            frontend:
              - 'src/frontend/**'
            backend:
              - 'src/scotty.microservice/**'
              - 'src/scotty.microservice.host/**'
              - 'src/scotty.providers.weesky/**'
              - 'src/scotty.providers.weesky.Tests/**'
              - 'src/scotty.microservice.sln'
              - 'src/Directory.Build.props'

  ci-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:coverage
      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: src/frontend/coverage/cobertura-coverage.xml
          badge: true
          format: markdown
          output: both
      - name: Find PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // ""')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: PR comment
        if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.number }}
          recreate: true
          path: code-coverage-results.md
      - name: Create env files
        run: |
          echo "VITE_API_BASE=${{ secrets.API_ENDPOINT_PROD }}" > .env.production
          echo "VITE_API_BASE=${{ secrets.API_ENDPOINT_DEV }}" > .env.dev
      - name: Build
        env:
          # The same switch the API build reads as -p:ReleaseBuild: without it a build is -dev.
          RELEASE_BUILD: ${{ github.ref_name == 'master' }}
        run: npm run build ${{ github.ref_name != 'master' && '-- --mode dev' || '' }}
      - name: The licence notices ship with the bundle
        run: test -s dist/third-party-licenses.html
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist
          retention-days: 1

  ci-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          # The solution root: one restore, one build, both test projects.
          working-directory: src
      - name: Find PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // ""')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: PR comment
        if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.number }}
          recreate: true
          path: code-coverage-results.md
      - name: Restore for publish
        run: dotnet restore src/scotty.microservice.host/scotty.microservice.host.csproj -r linux-x64
      - name: Publish
        run: >
          dotnet publish src/scotty.microservice.host/scotty.microservice.host.csproj
          -c Release -r linux-x64 --self-contained
          -p:ReleaseBuild=${{ github.ref_name == 'master' }}
          --no-restore
          -p:SatelliteResourceLanguages=
          -p:DebugType=None -p:DebugSymbols=false
          -o ${{ github.workspace }}/publish
      - name: Trim publish output
        run: |
          rm -rf \
            ${{ github.workspace }}/publish/alpine \
            ${{ github.workspace }}/publish/arm64 \
            ${{ github.workspace }}/publish/CodeCoverage \
            ${{ github.workspace }}/publish/macos \
            ${{ github.workspace }}/publish/ubuntu \
            ${{ github.workspace }}/publish/x64 \
            ${{ github.workspace }}/publish/x86
      - uses: actions/upload-artifact@v4
        with:
          name: microservice-publish
          path: ${{ github.workspace }}/publish
          retention-days: 1

  ci-result:
    needs: [ci-frontend, ci-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          if [[ "${{ needs.ci-frontend.result }}" == "failure" || \
                "${{ needs.ci-backend.result }}" == "failure" ]]; then
            exit 1
          fi

  deploy:
    needs: [detect-changes, ci-result]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    permissions:
      actions: write
      # The release tag below is pushed from here.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Open SSH port
        uses: ./.github/actions/firewall
        with:
          enabled: '1'
          credentials: ${{ secrets.OPNSENSE_CREDENTIALS }}
          endpoint: ${{ secrets.OPNSENSE_ENDPOINT }}
          rule_id: ${{ secrets.OPNSENSE_RULE_ID }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      # === Frontend ===

      - name: Download frontend dist
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            DEPLOY_PATH="${{ secrets.DEPLOY_BASE_PATH }}/account.frontend"
          else
            DEPLOY_PATH="${{ secrets.DEPLOY_BASE_PATH }}-dev/account.frontend"
          fi
          tar -cf - -C dist . | ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 -o ServerAliveInterval=60 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p $DEPLOY_PATH && \
             find $DEPLOY_PATH -mindepth 1 -delete && \
             sudo tar -xf - -C $DEPLOY_PATH && \
             sudo find $DEPLOY_PATH -type d -exec chmod 775 {} + && \
             sudo find $DEPLOY_PATH -type f -exec chmod 664 {} + && \
             sudo chown -R root:${{ secrets.DEPLOY_USER }} $DEPLOY_PATH"

      # === Microservice ===

      - name: Download microservice publish
        if: needs.detect-changes.outputs.backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: microservice-publish
          path: publish

      - name: Deploy microservice
        if: needs.detect-changes.outputs.backend == 'true'
        env:
          SCHEMA_CONNECTION: ${{ secrets.WEBMAIL_SCHEMA_CONNECTION }}
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            DEPLOY_PATH="${{ secrets.DEPLOY_BASE_PATH }}/scotty.microservice"
            SERVICE_NAME="scotty.microservice"
          else
            DEPLOY_PATH="${{ secrets.DEPLOY_BASE_PATH }}-dev/scotty.microservice"
            SERVICE_NAME="scotty.microservice-dev"
          fi
          tar -cf - -C publish . | ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 -o ServerAliveInterval=60 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p $DEPLOY_PATH && \
             sudo tar -xf - -C $DEPLOY_PATH && \
             sudo find $DEPLOY_PATH -type d -exec chmod 770 {} + && \
             sudo find $DEPLOY_PATH -type f -exec chmod 660 {} + && \
             sudo chmod 760 $DEPLOY_PATH/scotty.microservice && \
             sudo chown -R root:${{ secrets.DEPLOY_USER }} $DEPLOY_PATH"
          # Before the restart, so a failed migration leaves the previous version running. The
          # connection travels on standard input: sudo empties the environment, and ps shows argv.
          printf '%s\n' "$SCHEMA_CONNECTION" | ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 -o ServerAliveInterval=60 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo $DEPLOY_PATH/scotty.microservice migrate"
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo systemctl restart $SERVICE_NAME"

      - name: Close SSH port
        if: always()
        uses: ./.github/actions/firewall
        with:
          enabled: '0'
          credentials: ${{ secrets.OPNSENSE_CREDENTIALS }}
          endpoint: ${{ secrets.OPNSENSE_ENDPOINT }}
          rule_id: ${{ secrets.OPNSENSE_RULE_ID }}

      # One tag per half deployed, from that half's VERSION file: it is how a release is found
      # again afterwards. A warning rather than a failure when it already exists: an urgent fix
      # must still reach production when nobody bumped the file.
      - name: Tag the release
        if: success() && github.ref_name == 'master'
        env:
          FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          BACKEND: ${{ needs.detect-changes.outputs.backend }}
        run: |
          tag() {
            TAG="$1-v$(cat "$2")"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::warning::$TAG already exists — $2 was not bumped for this release"
            else
              git tag "$TAG"
              git push origin "$TAG"
            fi
          }
          if [ "$FRONTEND" = 'true' ]; then tag web src/frontend/VERSION; fi
          if [ "$BACKEND" = 'true' ]; then tag api src/scotty.microservice/VERSION; fi

      - name: Delete artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[].id' | \
            xargs -I{} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{}
