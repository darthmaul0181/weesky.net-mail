name: deploy

on:
  push:
    branches-ignore: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/frontend/**'
            backend:
              - 'src/snoopy.microservice/**'

  ci-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:coverage
      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: src/frontend/coverage/cobertura-coverage.xml
          badge: true
          format: markdown
          output: both
      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: code-coverage-results.md
      - name: Create env files
        if: github.event_name != 'pull_request'
        run: |
          echo "VITE_API_BASE=${{ secrets.API_ENDPOINT_PROD }}" > .env.production
          echo "VITE_API_BASE=${{ secrets.API_ENDPOINT_DEV }}" > .env.dev
      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build ${{ github.ref_name != 'master' && '-- --mode dev' || '' }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: frontend-dist
          path: src/frontend/dist
          retention-days: 1

  ci-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          working-directory: src/snoopy.microservice
      - name: Restore for publish
        if: github.event_name != 'pull_request'
        run: dotnet restore src/snoopy.microservice/snoopy.microservice.csproj -r linux-x64
      - name: Publish
        if: github.event_name != 'pull_request'
        run: >
          dotnet publish src/snoopy.microservice/snoopy.microservice.csproj
          -c Release -r linux-x64 --self-contained
          --no-restore
          -p:SatelliteResourceLanguages=
          -p:DebugType=None -p:DebugSymbols=false
          -o ${{ github.workspace }}/publish
      - name: Trim publish output
        if: github.event_name != 'pull_request'
        run: |
          rm -rf \
            ${{ github.workspace }}/publish/alpine \
            ${{ github.workspace }}/publish/arm64 \
            ${{ github.workspace }}/publish/CodeCoverage \
            ${{ github.workspace }}/publish/macos \
            ${{ github.workspace }}/publish/ubuntu \
            ${{ github.workspace }}/publish/x64 \
            ${{ github.workspace }}/publish/x86
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: microservice-publish
          path: ${{ github.workspace }}/publish
          retention-days: 1

  deploy:
    needs: [detect-changes, ci-frontend, ci-backend]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref_name != 'master' || github.event_name == 'workflow_dispatch') &&
      (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Open SSH port
        uses: ./.github/actions/firewall
        with:
          enabled: '1'
          credentials: ${{ secrets.OPNSENSE_CREDENTIALS }}
          endpoint: ${{ secrets.OPNSENSE_ENDPOINT }}
          rule_id: ${{ secrets.OPNSENSE_RULE_ID }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      # === Frontend ===

      - name: Download frontend dist
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            DEPLOY_PATH="${{ secrets.DEPLOY_BASE_PATH }}/account.frontend"
          else
            DEPLOY_PATH="${{ secrets.DEPLOY_BASE_PATH }}-dev/account.frontend"
          fi
          tar -cf - -C dist . | ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 -o ServerAliveInterval=60 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p $DEPLOY_PATH && \
             find $DEPLOY_PATH -mindepth 1 -delete && \
             sudo tar -xf - -C $DEPLOY_PATH && \
             sudo find $DEPLOY_PATH -type d -exec chmod 775 {} + && \
             sudo find $DEPLOY_PATH -type f -exec chmod 664 {} + && \
             sudo chown -R root:${{ secrets.DEPLOY_USER }} $DEPLOY_PATH"

      # === Microservice ===

      - name: Download microservice publish
        if: needs.detect-changes.outputs.backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: microservice-publish
          path: publish

      - name: Deploy microservice
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            DEPLOY_PATH="${{ secrets.DEPLOY_BASE_PATH }}/snoopy.microservice"
            SERVICE_NAME="snoopy.microservice"
          else
            DEPLOY_PATH="${{ secrets.DEPLOY_BASE_PATH }}-dev/snoopy.microservice"
            SERVICE_NAME="snoopy.microservice-dev"
          fi
          tar -cf - -C publish . | ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=30 -o ServerAliveInterval=60 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p $DEPLOY_PATH && \
             sudo tar -xf - -C $DEPLOY_PATH && \
             sudo find $DEPLOY_PATH -type d -exec chmod 770 {} + && \
             sudo find $DEPLOY_PATH -type f -exec chmod 660 {} + && \
             sudo chmod 760 $DEPLOY_PATH/snoopy.microservice && \
             sudo chown -R root:${{ secrets.DEPLOY_USER }} $DEPLOY_PATH && \
             sudo systemctl restart $SERVICE_NAME"

      - name: Close SSH port
        if: always()
        uses: ./.github/actions/firewall
        with:
          enabled: '0'
          credentials: ${{ secrets.OPNSENSE_CREDENTIALS }}
          endpoint: ${{ secrets.OPNSENSE_ENDPOINT }}
          rule_id: ${{ secrets.OPNSENSE_RULE_ID }}

      - name: Delete artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[].id' | \
            xargs -I{} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{}
