# This workflow will build a Node.js project with Vite
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: account-frontend

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: src/frontend

    steps:
    - uses: actions/checkout@v4
    - name: Node setup
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
        cache-dependency-path: src/frontend/package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Lint
      run: npm run lint
    - name: Test
      run: npm run test:coverage
    - name: Coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: src/frontend/coverage/cobertura-coverage.xml
        badge: true
        format: markdown
        output: both
    - name: PR comment
      uses: marocchino/sticky-pull-request-comment@v3
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
    - name: Build
      run: npm run build
      env:
        VITE_API_BASE: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'master' && 'https://api-dev.mail.weesky.net' || '' }}
    - name: Upload dist
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: src/frontend/dist
        retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open SSH port
        uses: ./.github/actions/firewall
        with:
          enabled: '1'
          credentials: ${{ secrets.OPNSENSE_CREDENTIALS }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Set deploy path
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "DEPLOY_PATH=/var/www/admin/mail/account.frontend" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=/var/www/admin/mail-dev/account.frontend" >> $GITHUB_ENV
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          tar -cf - -C dist . | ssh -i ~/.ssh/deploy_key github@curiosity.weesky.net \
            "mkdir -p $DEPLOY_PATH && \
             find $DEPLOY_PATH -mindepth 1 -delete && \
             sudo tar -xf - -C $DEPLOY_PATH && \
             sudo find $DEPLOY_PATH -type d -exec chmod 775 {} + && \
             sudo find $DEPLOY_PATH -type f -exec chmod 664 {} + && \
             sudo chown -R root:github $DEPLOY_PATH"

      - name: Close SSH port
        if: always()
        uses: ./.github/actions/firewall
        with:
          enabled: '0'
          credentials: ${{ secrets.OPNSENSE_CREDENTIALS }}
