# This workflow will build a Node.js project with Vite
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: account-frontend

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: mail/frontend

    steps:
    - uses: actions/checkout@v4
    - name: Node setup
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
        cache-dependency-path: mail/frontend/package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Lint
      run: npm run lint
    - name: Test
      run: npm run test:coverage
    - name: Coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: mail/frontend/coverage/cobertura-coverage.xml
        badge: true
        format: markdown
        output: both
    - name: PR comment
      uses: marocchino/sticky-pull-request-comment@v3
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
    - name: Build
      run: npm run build
