<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo-192.png" />
    <title></title>
    <script>document.title = window.location.hostname</script>
    <script>
      (function(){
        var t=localStorage.getItem('appearance_theme')||'system';
        var d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme',d?'dark':'light');
        var p=localStorage.getItem('appearance_palette');
        if(['night','classic','forest','slate','plum','ink','azure','indigo'].indexOf(p)<0)p='night';
        document.documentElement.setAttribute('data-palette',p);
        var langs=['en','fr'];
        var l=localStorage.getItem('ui_language');
        if(langs.indexOf(l)<0){
          var nav=navigator.languages||[navigator.language||'en'];
          l='en';
          for(var i=0;i<nav.length;i++){
            var c=String(nav[i]).split('-')[0].toLowerCase();
            if(langs.indexOf(c)>=0){l=c;break}
          }
        }
        document.documentElement.lang=l;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
