<!doctype html>
<!--
  Probe: does a message's own stylesheet reach the reader's frame, fit a phone, and draw the
  sender's dark design only when it should?

  The body goes through the REAL client pipeline, imported from src/modules/mail/reader in
  MessageReader's order: reveal on consent, settle prefers-color-scheme, recolour unless the sender's
  dark design wins, DOMPurify, then renderBodyDocument. Nothing is retyped here, so a change to any
  step changes what is measured. Inline cid: images are not substituted: they need the API.

  Served by the Vite dev server (npm run dev) at /probes/mail-stylesheets.html. Paste a body the
  server sanitised (the `html` field of its JSON) into the textarea, tick `declaresDarkScheme` to
  match, and press Render; "Synthetic" restores the built-in fixture. #out holds the JSON and
  document.title becomes 'probe-done' after each render.

  Two frames, same srcdoc and width:
  - `product` carries MessageReader's exact sandbox. The parent cannot read it (no same-origin).
  - `measure` adds allow-same-origin, still without allow-scripts, so nothing in it runs; it exists
    only in this local probe, purely to be measured. Never in the product. Being same-origin, it
    also receives what a colour extension (Dark Reader) injects: measure in a profile without one,
    or a light body reads back dark.

  Reading the numbers:
  - `overflow`: the measured document's scrollWidth - clientWidth. 0 means no sideways scroll.
  - `darkLogo`: whether any .dark-img is displayed (the Lottery's logo swap); null when none exists.
  - `bodyBackground` / `widestTable`: the body's computed background and the widest table's width
    and background, to check a desktop column keeps its size and a dark design its colour.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; padding: 16px; font: 13px/1.4 system-ui, sans-serif; background: #f4f4f4; color: #111; }
    fieldset { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border: 1px solid #ccc; margin: 0 0 12px; }
    #fixture { width: 100%; height: 120px; box-sizing: border-box; font: 12px monospace; }
    #out { white-space: pre; font: 12px monospace; background: #fff; padding: 8px; border: 1px solid #ccc; }
    .frames { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    .frames figure { margin: 0; }
    .frames iframe { height: 640px; border: 1px solid #888; display: block; background: #fff; }
  </style>
</head>
<body>
  <fieldset>
    <label>width
      <select id="width"><option value="360">360</option><option value="1024">1024</option></select>
    </label>
    <label>theme
      <select id="theme"><option value="light">light</option><option value="dark">dark</option></select>
    </label>
    <label>remote
      <select id="remote"><option value="off">off</option><option value="on">on</option></select>
    </label>
    <label><input type="checkbox" id="declares" /> declaresDarkScheme</label>
    <button id="render" type="button">Render</button>
    <button id="synthetic" type="button">Synthetic</button>
  </fieldset>
  <textarea id="fixture" spellcheck="false" aria-label="sanitised body"></textarea>
  <pre id="out">rendering…</pre>
  <div class="frames">
    <figure><figcaption>product (MessageReader's sandbox)</figcaption>
      <iframe id="product" sandbox="allow-popups allow-popups-to-escape-sandbox" title="product"></iframe>
    </figure>
    <figure><figcaption>measure (allow-same-origin, no scripts)</figcaption>
      <iframe id="measure" sandbox="allow-same-origin" title="measure"></iframe>
    </figure>
  </div>
  <script type="module">
    import { renderBodyDocument, revealBlockedImages, sanitizeBody } from '/src/modules/mail/reader/sanitizeBody.ts'
    import { hasDarkDesign, resolveColourScheme } from '/src/modules/mail/reader/messageStyles.ts'
    import { darkenColours } from '/src/modules/mail/reader/darkenColours.ts'

    const svg = (fill, label) => 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40"><rect width="160" height="40" fill="${fill}"/>` +
      `<text x="80" y="26" font-size="16" text-anchor="middle" fill="#888">${label}</text></svg>`)

    // Shaped like the server's output: the head <style> moved into the body, remote image withheld.
    // `body { width: 100% }` is the Claude mail's: overflow must still read 0 beside our padding.
    const SYNTHETIC = `<style>
body { width: 100%; }
.wrapper { width: 600px; background-color: #ffffff; color: #222222; }
.dark-img { display: none; }
@media only screen and (max-width: 600px) { .wrapper { width: 100% !important } }
@media (prefers-color-scheme: dark) {
  .wrapper { background-color: #262624 !important; color: #eeeeee !important }
  .light-img { display: none !important }
  .dark-img { display: block !important }
}
</style>
<table class="wrapper" width="600" cellpadding="0" cellspacing="0" align="center"><tbody>
<tr><td style="padding: 16px">
<img class="light-img" src="${svg('#ffffff', 'light logo')}" width="160" height="40" alt="light logo">
<img class="dark-img" src="${svg('#000000', 'dark logo')}" width="160" height="40" alt="dark logo">
</td></tr>
<tr><td style="padding: 16px">A 600px desktop column that must shrink to the phone's width and keep its size on a desktop.</td></tr>
<tr><td style="padding: 16px"><img data-blocked-src="https://example.com/probe.png" width="120" height="30" alt="remote"></td></tr>
</tbody></table>`

    const $ = id => document.getElementById(id)
    const product = $('product'), measure = $('measure')

    function loadSynthetic() {
      $('fixture').value = SYNTHETIC
      $('declares').checked = true
    }

    // MessageReader's pipeline, step for step.
    function pipeline(html, { dark, declares, remote }) {
      const senderDark = dark && declares && hasDarkDesign(html)
      const revealed = remote ? revealBlockedImages(html) : html
      const schemed = resolveColourScheme(revealed, senderDark ? 'dark' : 'light')
      return { senderDark, body: sanitizeBody(dark && !senderDark ? darkenColours(schemed) : schemed) }
    }

    function loaded(frame) {
      return new Promise(resolve => frame.addEventListener('load', resolve, { once: true }))
    }

    async function render() {
      document.title = 'rendering'
      const width = Number($('width').value)
      const options = { dark: $('theme').value === 'dark', declares: $('declares').checked, remote: $('remote').value === 'on' }
      const { senderDark, body } = pipeline($('fixture').value, options)
      // useViewport's phone breakpoint is max-width: 639px.
      const doc = renderBodyDocument(body, { dark: options.dark, senderDark, remote: options.remote, narrow: width < 640 })

      const done = Promise.all([loaded(product), loaded(measure)])
      for (const frame of [product, measure]) { frame.style.width = width + 'px'; frame.srcdoc = doc }
      await done

      const d = measure.contentDocument, win = measure.contentWindow
      const darkImgs = [...d.querySelectorAll('.dark-img')]
      const tables = [...d.querySelectorAll('table')]
      const widest = tables.reduce((a, t) => (!a || t.offsetWidth > a.offsetWidth ? t : a), null)
      const result = {
        width, theme: $('theme').value, remote: $('remote').value, declaresDarkScheme: options.declares,
        senderDark,
        overflow: d.documentElement.scrollWidth - d.documentElement.clientWidth,
        darkLogo: darkImgs.length ? darkImgs.some(i => win.getComputedStyle(i).display !== 'none') : null,
        bodyBackground: win.getComputedStyle(d.body).backgroundColor,
        widestTable: widest && { width: widest.offsetWidth, background: win.getComputedStyle(widest).backgroundColor },
        styleElements: d.body.querySelectorAll('style').length,
      }
      $('out').textContent = JSON.stringify(result, null, 2)
      document.title = 'probe-done'
    }

    $('render').addEventListener('click', render)
    for (const id of ['width', 'theme', 'remote', 'declares']) $(id).addEventListener('change', render)
    $('synthetic').addEventListener('click', () => { loadSynthetic(); render() })
    loadSynthetic()
    render()
  </script>
</body>
</html>
